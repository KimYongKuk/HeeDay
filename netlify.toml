[build]
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  PNPM_FLAGS = "--frozen-lockfile"

# Next.js runtime (SSR + route handlers). Requires publish = ".next" together with the plugin.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Set DATABASE_URL and DATABASE_SSL=1 in Site settings → Environment variables.
