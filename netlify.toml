[build]
  command = "pnpm build"

[build.environment]
  NODE_VERSION = "22"
  PNPM_FLAGS = "--frozen-lockfile"

# Next.js runtime (SSR + route handlers). Do not set a publish directory; the plugin manages it.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Set DATABASE_URL and DATABASE_SSL=1 in Site settings → Environment variables.
